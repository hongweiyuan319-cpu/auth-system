name: React-Flask CI/CD Pipeline

on:
  push:
    branches:
      - main  # 每次推送到 main 分支时自动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 登录云服务器并自动执行更新脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 成功连接服务器，开始拉取最新代码..."
            cd /home/ubuntu/auth-system
            
            # 放行合并并拉取最新代码 (假设你在服务器配好了 Git 权限)
            git pull origin main

            echo "🌐 === 开始编译并更新前端 ==="
            cd front
            npm install
            npm run build
            sudo cp -r dist/* /var/www/auth-frontend/
            sudo chown -R www-data:www-data /var/www/auth-frontend
            
            echo "⚙️ === 开始更新后端并重启服务 ==="
            cd ../backend
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart auth-backend

            echo "🎉 恭喜！全栈自动部署完成！"