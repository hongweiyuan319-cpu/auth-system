# ===== 测试环境自动部署 =====
#
# 触发条件：推送到 test 分支（或在 Actions 页面手动点按钮）
#
# 为什么单独建这个文件，而不改 deploy.yml？
#   deploy.yml 监听 main，负责「正式环境」；
#   这个文件监听 test，负责「测试环境」。
#   两个环境的部署方式不同（测试环境用 Docker Compose），
#   混在一个文件里会用一堆 if 判断分支，反而更难维护。
#
# ⚠️ 关键设计：部署到独立目录 /home/ubuntu/auth-system-test
#   为什么不复用 /home/ubuntu/auth-system？
#     因为那个目录是正式环境在用的（systemd 的 auth-backend 从那里启动代码）。
#     如果在里面执行 git checkout test，会把服务器上的代码切到测试分支 ——
#     正式服务重启后就会跑起测试代码，这是很危险的副作用。
#   所以测试环境用自己的独立目录，两边互不干扰。

name: Deploy Test Environment (Docker)

on:
  push:
    branches:
      - test # 只有推送 test 分支才触发
  workflow_dispatch: # 也支持在 GitHub 页面手动触发，方便排查问题

# GITHUB_TOKEN 的权限：拉代码只需要读
permissions:
  contents: read

# 防止两次推送并发部署，互相踩到对方
concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  # 服务器上测试环境的独立目录（与正式环境隔离）
  APP_DIR: /home/ubuntu/auth-system-test
  # 用 HTTPS 而不是 SSH：
  #   实测服务器上没有能访问本仓库的 SSH 密钥（ssh -T git@github.com 返回
  #   Permission denied (publickey)），所以 git@github.com:... 这种地址
  #   在服务器上克隆必定失败。
  REPO_URL: https://github.com/hongweiyuan319-cpu/auth-system.git

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: 在测试服务器上同步代码并用 Docker 重建
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ⚠️ 这里故意不写 script_stop: true！
          #   从 appleboy/drone-ssh 的源码看，开启 script_stop 后脚本会被
          #       strings.Split(cmd, "\n")
          #   按行拆开逐行执行，多行结构（if/then、for/do、case/esac）会被拆散，
          #   报错形如：
          #       bash: -c: line 96: syntax error near unexpected token `;'
          #   我们要的「任何一步失败就中止」由脚本开头的 `set -e` 保证，效果一样。
          script: |
            set -e

            echo "========== 0. 环境检查 =========="
            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ 服务器上没有 docker。先安装："
              echo "   curl -fsSL https://get.docker.com | sudo sh"
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "❌ 没有 docker compose 插件（需要 Compose v2）"
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "❌ 当前用户没有 docker 权限（多半是没加进 docker 组）"
              echo "   解决：sudo usermod -aG docker $USER  然后重新登录一次"
              exit 1
            fi
            docker --version
            docker compose version

            # 提前探一下镜像源通不通。这一步只诊断、不改任何配置。
            # 国内服务器经常连不上 Docker Hub，早发现比等到构建中途报错省事。
            echo "  镜像源连通性（200/401 都算通，000 表示连不上）："
            if command -v curl >/dev/null 2>&1; then
              for u in \
                https://registry-1.docker.io/v2/ \
                https://docker.m.daocloud.io/v2/ \
                https://docker.1ms.run/v2/ \
                https://hub.rat.dev/v2/ \
                https://mirror.ccs.tencentyun.com/v2/ \
                https://pypi.tuna.tsinghua.edu.cn/simple/ \
              ; do
                code=$(curl -s -o /dev/null -m 8 -w "%{http_code}" "$u" 2>/dev/null || true)
                printf "    %-46s %s\n" "$u" "$code"
              done
            else
              echo "    服务器没有 curl，跳过"
            fi

            # 顺手把磁盘情况也打出来。为什么要放这里？
            #   构建或启动失败时，「磁盘被撑满」是很常见、又最不容易一眼看出的原因 ——
            #   报错往往出现在构建中途，看起来像是 Dockerfile 写错了。
            #   提前记录一行，出事时对着日志就能直接排除掉这种可能。
            # 怎么看：df 关注「系统盘 /」那一行的 Avail（剩余）和 Use%；
            #   docker system df 则告诉我们空间被谁吃了
            #   （Images / Containers / Local Volumes / Build Cache 四项）。
            echo "  磁盘占用（系统盘）："
            df -h / | sed 's/^/    /' || true
            echo "  Docker 空间占用明细："
            docker system df 2>/dev/null | sed 's/^/    /' || true

            echo ""
            echo "========== 1. 确定用哪种方式拉代码 =========="
            # 背景（实测结论）：
            #   - 服务器到 github.com 的网络是通的
            #   - 但服务器上没有能访问本仓库的 SSH 密钥，
            #     ssh -T git@github.com 返回 Permission denied (publickey)
            #   所以不能直接用 git@github.com 地址克隆。
            #
            # 策略，按优先级：
            #   ① 复用正式环境目录里已配好的 remote
            #      （main 的流水线一直能成功跑 git pull origin main，
            #        说明那套凭据是好的，没必要重新配一套）
            #   ② 退而用 GitHub 临时令牌走 HTTPS
            #      GITHUB_TOKEN 由 Actions 自动注入，不需要任何手工配置

            REPO_URL="${{ env.REPO_URL }}"
            SYNC_URL=""

            # ---- ① 看看有没有现成的正式环境目录 ----
            EXISTING_DIR=""
            for d in /home/*/auth-system /root/auth-system; do
              if [ -d "$d/.git" ]; then EXISTING_DIR="$d"; break; fi
            done

            if [ -n "$EXISTING_DIR" ]; then
              CANDIDATE=$(git -C "$EXISTING_DIR" remote get-url origin 2>/dev/null || true)
              echo "  找到现有部署目录：$EXISTING_DIR"

              # ⚠️ 护栏：检查生产目录停在哪个分支。这是实测踩出来的，后果有三重：
              #   2026-09-22 实测发现 /home/ubuntu/auth-system 停在了 test 分支，于是：
              #     1. 正式服务跑的是测试分支的代码（未经评审）
              #     2. main 的流水线在那里执行 `git pull origin main` 时，因为当前分支
              #        是 test，这句会变成「把 main 合并进 test」—— 而 test 本来就包含
              #        main，所以直接输出 "Already up to date"，**看着绿、其实什么都没部署**
              #     3. test 分支里有 docker-compose.test.yml，有人在那个目录里
              #        `docker compose up` 就会起出第二套 compose 项目（项目名取自
              #        目录名 auth-system），把 5001/8080 抢走 —— 于是本流水线报
              #        "Bind for 0.0.0.0:5001 failed: port is already allocated"
              #   这里只警告、不中止：测试环境该部署还是要部署，不能因为生产目录的问题
              #   把测试流程也卡住。
              PROD_BRANCH=$(git -C "$EXISTING_DIR" branch --show-current 2>/dev/null || echo "未知")
              if [ "$PROD_BRANCH" = "test" ]; then
                echo ""
                echo "  ⚠️⚠️ 警告：生产目录 $EXISTING_DIR 当前停在 test 分支上！"
                echo "      正式服务跑的是测试代码，且 main 的部署流水线会变成空跑。"
                echo "      处理：cd $EXISTING_DIR && git checkout main && git pull origin main"
                echo "           然后 sudo systemctl restart auth-backend，并重跑 main 的流水线"
                echo ""
              else
                echo "  它的当前分支：$PROD_BRANCH"
              fi

              if [ -n "$CANDIDATE" ]; then
                # 只打印脱敏后的地址！URL 里可能内嵌令牌，绝不能原样打进 CI 日志
                SAFE=$(echo "$CANDIDATE" | sed -E 's#//[^@/]*@#//***@#')
                echo "  它的 origin 是：$SAFE"
                # 只复用 HTTPS 形式；SSH 形式已实测在当前环境不可用
                case "$CANDIDATE" in
                  https://*) SYNC_URL="$CANDIDATE" ;;
                  *)         echo "  它是 SSH 形式，已实测不可用，跳过" ;;
                esac
              fi
            else
              echo "  没找到现有部署目录"
            fi

            # ---- ② 兜底：用 Actions 自带的临时令牌 ----
            if [ -z "$SYNC_URL" ]; then
              echo "  改用 GITHUB_TOKEN 走 HTTPS（临时令牌，任务结束即失效）"
              SYNC_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${REPO_URL#https://}"
            fi

            echo ""
            echo "========== 2. 同步代码到测试专用目录 =========="
            # 服务器到 github.com 的连接不稳定 —— 实测出现过：
            #   Failed to connect to github.com port 443 after 130295 ms: Connection timed out
            # 所以加两道保护：
            #   1. 低速阈值：连接卡住 30 秒就主动断开，不要干等到 130 秒
            #   2. 重试：最多 3 次，给网络波动留点余地
            export GIT_HTTP_LOW_SPEED_LIMIT=1000
            export GIT_HTTP_LOW_SPEED_TIME=30

            if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
              echo "  目录不存在，首次克隆..."
              # 先克隆到临时目录，成功了再改名过去 ——
              # 这样重试时不会污染正式目录，克隆本身也是「一次成型」的
              TMP_DIR="${{ env.APP_DIR }}.tmp"
              ok=0
              for attempt in 1 2 3; do
                rm -rf "$TMP_DIR"
                if git clone "$SYNC_URL" "$TMP_DIR"; then ok=1; break; fi
                echo "  第 $attempt 次克隆失败，5 秒后重试..."
                sleep 5
              done
              if [ "$ok" != "1" ]; then
                echo "❌ 连续 3 次克隆失败，请检查服务器到 github.com 的网络"
                exit 1
              fi
              mv "$TMP_DIR" "${{ env.APP_DIR }}"
              # 克隆完立刻把带令牌的地址从配置里抹掉，
              # 免得令牌（即使很快过期）留在服务器的 .git/config 里
              git -C "${{ env.APP_DIR }}" remote set-url origin "$REPO_URL"
            fi
            cd "${{ env.APP_DIR }}"

            # 显式用 SYNC_URL 去 fetch，而不是让 git 读 origin：
            # 这样临时令牌不会持久化在仓库配置里，每次部署现取现用。
            # 开头的 + 表示允许非快进，强制把远端 test 同步过来。
            ok=0
            for attempt in 1 2 3; do
              if git fetch "$SYNC_URL" "+test:refs/remotes/origin/test"; then ok=1; break; fi
              echo "  第 $attempt 次拉取失败，5 秒后重试..."
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "❌ 连续 3 次拉取失败，请检查服务器到 github.com 的网络"
              exit 1
            fi

            # -f -B 的含义：强制把本地 test 分支重置到 origin/test 并切过去。
            # 部署目录里有本地改动一律丢弃 —— 服务器上的代码永远以仓库为准。
            git checkout -f -B test origin/test
            echo "  当前提交：$(git log --oneline -1)"

            echo ""
            echo "========== 3. 释放端口并做占用预检 =========="
            # ⚠️ 这一节是被真实事故加进来的，不要删。
            #   Run #15（2026-09-22）就死在这里：前面的构建全绿、镜像也成功导出了，
            #   直到启动容器的那一刻报错 ——
            #     Bind for 0.0.0.0:5001 failed: port is already allocated
            #   意思是宿主机的 5001 已经被别的东西占着（多半是上一次部署残留的
            #   容器），新后端容器绑不上这个端口，compose 直接失败，整条流水线变红。
            #   这类失败的特征是「构建看起来一切正常，却在启动瞬间挂掉」。
            #
            # 所以先用 down 把「本项目自己的」容器和网络收干净。两个好处：
            #   1. 8080 / 5001 两个端口一定被释放，不会再撞车
            #   2. --remove-orphans 顺手清掉改过 service 名之后遗留的孤儿容器
            # 注意：down 会删掉容器，而测试库在容器内部、没有挂数据卷，
            #       所以测试数据会清空 —— 这在《测试交接单》里已写明是预期行为。
            docker compose -f docker-compose.test.yml down --remove-orphans || true

            # down 之后端口还被占，说明占用者不是本项目的容器。
            # ⚠️ 实测（2026-09-22）就是这么挂的：占着 5001 的是**另一个 compose
            #   项目**的容器 —— 容器名 auth-system-backend-test-1，项目名 auth-system，
            #   而本流水线的项目名是 auth-system-test（取自部署目录名）。
            #   两个名字只差一点，光看容器名很容易看漏，所以这里把「项目名 + 工作目录」
            #   两个标签一起打印出来，一眼就能看出它是从哪个目录起的。
            # 这种情况不要盲目去 kill 别人的东西，只打印清楚，交给人判断。
            PORT_BUSY=0
            for p in 8080 5001; do
              IDS=$(docker ps -q --filter "publish=$p" 2>/dev/null || true)
              if [ -z "$IDS" ]; then
                echo "  ✅ 端口 $p 已空闲"
                continue
              fi
              PORT_BUSY=1
              echo "  ❌ 端口 $p 仍被占用："
              # 用 docker ps --format 直接读 compose 标签（比 docker inspect 稳：
              # 遇到没有这些标签的普通容器也不会报错，只会留空）
              docker ps --filter "publish=$p" \
                --format '     {{.Names}}  项目={{.Label "com.docker.compose.project"}}  起于={{.Label "com.docker.compose.project.working_dir"}}' \
                2>/dev/null || true
            done
            if [ "$PORT_BUSY" != "0" ]; then
              echo ""
              echo "❌ 有端口被「非本项目」的容器占用，已中止部署，避免误伤服务器上别的服务。"
              echo "   上面的「项目 / 起于」标签就是排查线索：如果是另一个 compose 项目，"
              echo "   说明服务器上还有一套别的部署在跑，要先把那套停掉，再重跑流水线。"
              exit 1
            fi

            echo ""
            echo "========== 4. 构建并启动测试环境 =========="
            # --build   重新构建镜像，保证跑的是最新代码
            # --wait    等所有服务的 healthcheck 都通过才返回
            #           （只用 -d 的话，命令返回时 nginx 可能还在跑 entrypoint
            #            脚本，紧接着的验证会拿到 000）
            docker compose -f docker-compose.test.yml up -d --build --wait

            echo ""
            echo "========== 5. 两个容器的就绪状态 =========="
            # --wait 已经等过了，这里只是把结果打出来留个记录
            for svc in backend-test front-test; do
              CID=$(docker compose -f docker-compose.test.yml ps -q "$svc")
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
              echo "  $svc -> $STATUS"
            done

            echo ""
            echo "========== 6. 端到端验证（经 nginx 代理）=========="
            # 前面的 healthcheck 只证明「容器」活着；
            # 这里再从「前端 nginx」那一侧打一次，才能确认 nginx.conf 里的
            # /api/ 反代确实通 —— 也就是浏览器里走的真实路径。
            #
            # 为什么这里还要轮询？第一次加这个检查时就踩了坑：
            # up -d 之后立刻 curl，nginx 还在跑 entrypoint 脚本，拿到的是 000。
            # --wait 已经等过一轮了，这里再给点余量，避免偶发假失败。
            FRONT_CODE="000"
            for i in $(seq 1 15); do
              FRONT_CODE=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://127.0.0.1:8080/ || true)
              if [ "$FRONT_CODE" = "200" ]; then break; fi
              echo "  第 $i 次探前端首页：$FRONT_CODE"
              sleep 2
            done

            API_CODE=$(curl -s -o /dev/null -m 10 -w "%{http_code}" http://127.0.0.1:8080/api/user/profile || true)
            echo "  前端首页            http://127.0.0.1:8080/          -> $FRONT_CODE"
            echo "  经 nginx 调后端接口  http://127.0.0.1:8080/api/...   -> $API_CODE"

            if [ "$FRONT_CODE" != "200" ]; then
              echo "❌ 前端首页没返回 200"
              docker compose -f docker-compose.test.yml logs --tail 30 front-test
              exit 1
            fi

            # 不带 token 请求受保护接口，预期就是 401。
            # 这个判断同时证明两件事：
            #   1. nginx 的 /api/ 反代确实通到了后端
            #   2. JWT 鉴权在起作用（没有因为配置错误变成放行 200）
            if [ "$API_CODE" != "401" ]; then
              echo "❌ 经 nginx 的接口返回 $API_CODE，预期 401"
              exit 1
            fi
            echo "  ✅ 端到端验证通过：nginx 正常，/api/ 反代通到后端，鉴权生效"

            echo ""
            echo "========== 7. 最终状态 =========="
            docker compose -f docker-compose.test.yml ps

            echo ""
            echo "========== 8. 清理构建缓存与无用镜像，避免磁盘被撑满 =========="
            # ⚠️ 只清 dangling 镜像是**不够**的。
            #   真正会无限增长的是 BuildKit 的构建缓存：每一次 --build 都会留下新的层，
            #   而 `docker image prune` 管不到缓存这一块，必须用 `builder prune`。
            #   本项目在一天里就跑过十几次部署，缓存只涨不消，早晚把系统盘吃掉。
            # --keep-storage 2GB：保留最近 2GB 缓存，兼顾磁盘安全和下次构建速度。
            #   不要改成 -a / --all 全清 —— 那样下次部署要重新装 pip / npm 依赖，慢很多。
            docker builder prune -f --keep-storage 2GB || echo "  构建缓存清理失败，跳过（不影响本次部署结果）"
            docker image prune -f || true

            echo ""
            echo "🎉 测试环境部署完成"
            echo "   服务器上自测：http://$(hostname -I | awk '{print $1}'):8080"
            echo "   外部访问：    http://<服务器公网IP>:8080"
            echo "   外网打不开的话，检查云服务器安全组/防火墙有没有放行 8080"
