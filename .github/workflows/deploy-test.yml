# ===== 测试环境自动部署 =====
#
# 触发条件：推送到 test 分支（或在 Actions 页面手动点按钮）
#
# 为什么单独建这个文件，而不改 deploy.yml？
#   deploy.yml 监听 main，负责「正式环境」；
#   这个文件监听 test，负责「测试环境」。
#   两个环境的部署方式不同（测试环境用 Docker Compose），
#   混在一个文件里会用一堆 if 判断分支，反而更难维护。
#
# ⚠️ 关键设计：部署到独立目录 /home/ubuntu/auth-system-test
#   为什么不复用 /home/ubuntu/auth-system？
#     因为那个目录是正式环境在用的（systemd 的 auth-backend 从那里启动代码）。
#     如果在里面执行 git checkout test，会把服务器上的代码切到测试分支 ——
#     正式服务重启后就会跑起测试代码，这是很危险的副作用。
#   所以测试环境用自己的独立目录，两边互不干扰。

name: Deploy Test Environment (Docker)

on:
  push:
    branches:
      - test # 只有推送 test 分支才触发
  workflow_dispatch: # 也支持在 GitHub 页面手动触发，方便排查问题

# GITHUB_TOKEN 的权限：拉代码只需要读
permissions:
  contents: read

# 防止两次推送并发部署，互相踩到对方
concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  # 服务器上测试环境的独立目录（与正式环境隔离）
  APP_DIR: /home/ubuntu/auth-system-test
  # 用 HTTPS 而不是 SSH：
  #   实测服务器上没有能访问本仓库的 SSH 密钥（ssh -T git@github.com 返回
  #   Permission denied (publickey)），所以 git@github.com:... 这种地址
  #   在服务器上克隆必定失败。
  REPO_URL: https://github.com/hongweiyuan319-cpu/auth-system.git

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: 在测试服务器上同步代码并用 Docker 重建
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ⚠️ 这里故意不写 script_stop: true！
          #   从 appleboy/drone-ssh 的源码看，开启 script_stop 后脚本会被
          #       strings.Split(cmd, "\n")
          #   按行拆开逐行执行，多行结构（if/then、for/do、case/esac）会被拆散，
          #   报错形如：
          #       bash: -c: line 96: syntax error near unexpected token `;'
          #   我们要的「任何一步失败就中止」由脚本开头的 `set -e` 保证，效果一样。
          script: |
            set -e

            echo "========== 0. 环境检查 =========="
            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ 服务器上没有 docker。先安装："
              echo "   curl -fsSL https://get.docker.com | sudo sh"
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "❌ 没有 docker compose 插件（需要 Compose v2）"
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "❌ 当前用户没有 docker 权限（多半是没加进 docker 组）"
              echo "   解决：sudo usermod -aG docker $USER  然后重新登录一次"
              exit 1
            fi
            docker --version
            docker compose version

            echo ""
            echo "========== 1. 确定用哪种方式拉代码 =========="
            # 背景（实测结论）：
            #   - 服务器到 github.com 的网络是通的
            #   - 但服务器上没有能访问本仓库的 SSH 密钥，
            #     ssh -T git@github.com 返回 Permission denied (publickey)
            #   所以不能直接用 git@github.com 地址克隆。
            #
            # 策略，按优先级：
            #   ① 复用正式环境目录里已配好的 remote
            #      （main 的流水线一直能成功跑 git pull origin main，
            #        说明那套凭据是好的，没必要重新配一套）
            #   ② 退而用 GitHub 临时令牌走 HTTPS
            #      GITHUB_TOKEN 由 Actions 自动注入，不需要任何手工配置

            REPO_URL="${{ env.REPO_URL }}"
            SYNC_URL=""

            # ---- ① 看看有没有现成的正式环境目录 ----
            EXISTING_DIR=""
            for d in /home/*/auth-system /root/auth-system; do
              if [ -d "$d/.git" ]; then EXISTING_DIR="$d"; break; fi
            done

            if [ -n "$EXISTING_DIR" ]; then
              CANDIDATE=$(git -C "$EXISTING_DIR" remote get-url origin 2>/dev/null || true)
              echo "  找到现有部署目录：$EXISTING_DIR"
              if [ -n "$CANDIDATE" ]; then
                # 只打印脱敏后的地址！URL 里可能内嵌令牌，绝不能原样打进 CI 日志
                SAFE=$(echo "$CANDIDATE" | sed -E 's#//[^@/]*@#//***@#')
                echo "  它的 origin 是：$SAFE"
                # 只复用 HTTPS 形式；SSH 形式已实测在当前环境不可用
                case "$CANDIDATE" in
                  https://*) SYNC_URL="$CANDIDATE" ;;
                  *)         echo "  它是 SSH 形式，已实测不可用，跳过" ;;
                esac
              fi
            else
              echo "  没找到现有部署目录"
            fi

            # ---- ② 兜底：用 Actions 自带的临时令牌 ----
            if [ -z "$SYNC_URL" ]; then
              echo "  改用 GITHUB_TOKEN 走 HTTPS（临时令牌，任务结束即失效）"
              SYNC_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${REPO_URL#https://}"
            fi

            echo ""
            echo "========== 2. 同步代码到测试专用目录 =========="
            if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
              echo "  目录不存在，首次克隆..."
              git clone "$SYNC_URL" "${{ env.APP_DIR }}"
              # 克隆完立刻把带令牌的地址从配置里抹掉，
              # 免得令牌（即使很快过期）留在服务器的 .git/config 里
              git -C "${{ env.APP_DIR }}" remote set-url origin "$REPO_URL"
            fi
            cd "${{ env.APP_DIR }}"

            # 显式用 SYNC_URL 去 fetch，而不是让 git 读 origin：
            # 这样临时令牌不会持久化在仓库配置里，每次部署现取现用。
            # 开头的 + 表示允许非快进，强制把远端 test 同步过来。
            git fetch "$SYNC_URL" "+test:refs/remotes/origin/test"
            # -f -B 的含义：强制把本地 test 分支重置到 origin/test 并切过去。
            # 部署目录里有本地改动一律丢弃 —— 服务器上的代码永远以仓库为准。
            git checkout -f -B test origin/test
            echo "  当前提交：$(git log --oneline -1)"

            echo ""
            echo "========== 3. 构建并启动测试环境 =========="
            # --build 会重新构建镜像，保证跑的是最新代码
            docker compose -f docker-compose.test.yml up -d --build

            echo ""
            echo "========== 4. 等待后端变健康 =========="
            # 复用 compose 里配的 healthcheck（它会真的发 HTTP 请求，
            # 而不是只看端口通不通），最多等 60 秒
            CID=""
            for i in $(seq 1 30); do
              CID=$(docker compose -f docker-compose.test.yml ps -q backend-test)
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
              echo "  第 $i 次检查：$STATUS"
              if [ "$STATUS" = "healthy" ]; then break; fi
              sleep 2
            done

            if [ "$STATUS" != "healthy" ]; then
              echo ""
              echo "❌ 后端始终没能变成 healthy，最近 50 行日志："
              docker compose -f docker-compose.test.yml logs --tail 50 backend-test
              exit 1
            fi

            echo ""
            echo "========== 5. 最终状态 =========="
            docker compose -f docker-compose.test.yml ps

            echo ""
            echo "========== 6. 清理无用镜像，避免磁盘被撑满 =========="
            docker image prune -f

            echo ""
            echo "🎉 测试环境部署完成"
            echo "   访问地址：http://$(hostname -I | awk '{print $1}'):8080"
