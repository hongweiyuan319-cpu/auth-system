<svg xmlns="http://www.w3.org/2000/svg" width="660" height="840" viewBox="0 0 660 840" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="660" height="840" fill="#ffffff"/>
  <text x="330" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">登录功能 · token 数据流</text>

  <g text-anchor="middle">
    <rect x="90" y="70" width="480" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="330" y="89" font-size="14" font-weight="bold" fill="#1e293b">用户</text>
    <text x="330" y="105" font-size="12" fill="#475569">填账号密码，点登录</text>

    <rect x="90" y="140" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="159" font-size="14" font-weight="bold" fill="#0c4a6e">pages/Login.jsx</text>
    <text x="330" y="175" font-size="12" fill="#075985">调用 login(username, password)</text>

    <rect x="90" y="210" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="229" font-size="14" font-weight="bold" fill="#0c4a6e">api/auth.js</text>
    <text x="330" y="245" font-size="12" fill="#075985">request.post('/api/login', { username, password })</text>

    <rect x="90" y="280" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="299" font-size="14" font-weight="bold" fill="#0c4a6e">utils/request.js</text>
    <text x="330" y="315" font-size="12" fill="#075985">请求拦截器：从 localStorage 取 token 塞请求头（登录时无 token，跳过）</text>

    <rect x="90" y="350" width="480" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="330" y="369" font-size="14" font-weight="bold" fill="#991b1b">① HTTP POST → 127.0.0.1:5000/api/login</text>
    <text x="330" y="385" font-size="12" fill="#b91c1c">（跨网络：请求体带 { username, password }）</text>

    <rect x="90" y="420" width="480" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="330" y="439" font-size="14" font-weight="bold" fill="#14532d">后端 app.py</text>
    <text x="330" y="455" font-size="12" fill="#166534">查 SQLite → 校验密码 → 签发 JWT（2 小时过期）</text>

    <rect x="90" y="490" width="480" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="330" y="509" font-size="14" font-weight="bold" fill="#991b1b">② HTTP 响应 ← { access_token, code: 200 }</text>
    <text x="330" y="525" font-size="12" fill="#b91c1c">（跨网络：token 从这里被传回前端）</text>

    <rect x="90" y="560" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="579" font-size="14" font-weight="bold" fill="#0c4a6e">pages/Login.jsx</text>
    <text x="330" y="595" font-size="12" fill="#075985">取出 res.data.access_token</text>

    <rect x="90" y="630" width="480" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="330" y="649" font-size="14" font-weight="bold" fill="#4c1d95">context/AuthContext.jsx</text>
    <text x="330" y="665" font-size="12" fill="#5b21b6">login(token) → localStorage.setItem('token', token)</text>

    <rect x="90" y="700" width="480" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="330" y="719" font-size="14" font-weight="bold" fill="#4c1d95">AuthContext 状态更新</text>
    <text x="330" y="735" font-size="12" fill="#5b21b6">setUser(token) → 页面变"已登录" → navigate('/') 跳首页</text>

    <rect x="90" y="775" width="480" height="44" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-dasharray="6 4"/>
    <text x="330" y="794" font-size="13" font-weight="bold" fill="#713f12">闭环：以后每次请求，拦截器自动取出 token 塞进请求头</text>
    <text x="330" y="810" font-size="12" fill="#854d0e">后端 app.py 解析 Authorization 头验证身份</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="330" y1="114" x2="330" y2="136"/>
    <line x1="330" y1="184" x2="330" y2="206"/>
    <line x1="330" y1="254" x2="330" y2="276"/>
    <line x1="330" y1="324" x2="330" y2="346"/>
    <line x1="330" y1="394" x2="330" y2="416" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <line x1="330" y1="464" x2="330" y2="486"/>
    <line x1="330" y1="534" x2="330" y2="556" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <line x1="330" y1="604" x2="330" y2="626"/>
    <line x1="330" y1="674" x2="330" y2="696"/>
    <line x1="330" y1="744" x2="330" y2="771" stroke-dasharray="5 4"/>
  </g>
</svg>
