<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">全项目交互关系总图</text>

  <!-- 前端区 -->
  <rect x="20" y="50" width="570" height="545" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-dasharray="6 4"/>
  <text x="305" y="74" font-size="15" font-weight="bold" text-anchor="middle" fill="#0369a1">前端 front/ （浏览器 · Vite 5173）</text>

  <!-- 后端区 -->
  <rect x="640" y="50" width="540" height="545" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-dasharray="6 4"/>
  <text x="910" y="74" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">后端 backend/ （Flask 5000）</text>

  <!-- 前端 boxes -->
  <g text-anchor="middle">
    <rect x="60" y="90" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="165" y="108" font-size="14" font-weight="bold" fill="#0c4a6e">index.html</text>
    <text x="165" y="125" font-size="12" fill="#075985">入口外壳 #root</text>

    <rect x="60" y="170" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="165" y="188" font-size="14" font-weight="bold" fill="#0c4a6e">main.jsx</text>
    <text x="165" y="205" font-size="12" fill="#075985">React 启动入口</text>

    <rect x="60" y="250" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="165" y="268" font-size="14" font-weight="bold" fill="#0c4a6e">App.jsx</text>
    <text x="165" y="285" font-size="12" fill="#075985">路由地图</text>

    <rect x="40" y="330" width="160" height="46" rx="8" fill="#bae6fd" stroke="#0284c7"/>
    <text x="120" y="348" font-size="13" font-weight="bold" fill="#0c4a6e">pages/Login.jsx</text>
    <text x="120" y="364" font-size="11" fill="#075985">登录页</text>

    <rect x="215" y="330" width="160" height="46" rx="8" fill="#bae6fd" stroke="#0284c7"/>
    <text x="295" y="348" font-size="13" font-weight="bold" fill="#0c4a6e">pages/Register.jsx</text>
    <text x="295" y="364" font-size="11" fill="#075985">注册页</text>

    <rect x="390" y="330" width="160" height="46" rx="8" fill="#bae6fd" stroke="#0284c7"/>
    <text x="470" y="348" font-size="13" font-weight="bold" fill="#0c4a6e">pages/Home.jsx</text>
    <text x="470" y="364" font-size="11" fill="#075985">首页</text>

    <rect x="60" y="420" width="220" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="170" y="438" font-size="14" font-weight="bold" fill="#0c4a6e">api/auth.js</text>
    <text x="170" y="455" font-size="12" fill="#075985">接口封装</text>

    <rect x="310" y="420" width="240" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="430" y="438" font-size="14" font-weight="bold" fill="#0c4a6e">context/AuthContext.jsx</text>
    <text x="430" y="455" font-size="12" fill="#075985">登录状态公告栏</text>

    <rect x="60" y="505" width="220" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="170" y="523" font-size="14" font-weight="bold" fill="#0c4a6e">utils/request.js</text>
    <text x="170" y="540" font-size="12" fill="#075985">axios 实例 + 拦截器</text>

    <rect x="310" y="505" width="240" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="430" y="523" font-size="14" font-weight="bold" fill="#0c4a6e">localStorage</text>
    <text x="430" y="540" font-size="12" fill="#075985">存 token</text>
  </g>

  <!-- 前端 arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="165" y1="136" x2="165" y2="166"/>
    <line x1="165" y1="216" x2="165" y2="246"/>
    <path d="M 165 296 L 165 312 L 120 312 L 120 326"/>
    <path d="M 165 296 L 165 312 L 295 312 L 295 326"/>
    <path d="M 165 296 L 165 312 L 470 312 L 470 326"/>
    <path d="M 120 376 L 120 390 L 150 390 L 150 416"/>
    <path d="M 295 376 L 295 390 L 190 390 L 190 416"/>
    <line x1="470" y1="376" x2="470" y2="416"/>
    <line x1="170" y1="466" x2="170" y2="501"/>
    <line x1="430" y1="466" x2="430" y2="501" marker-start="url(#arr)"/>
  </g>

  <!-- 后端 boxes -->
  <g text-anchor="middle">
    <rect x="680" y="150" width="380" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="870" y="168" font-size="14" font-weight="bold" fill="#14532d">app.py</text>
    <text x="870" y="185" font-size="12" fill="#166534">路由 + JWT + SQLite</text>

    <rect x="680" y="240" width="380" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="870" y="258" font-size="14" font-weight="bold" fill="#14532d">validate_data.py</text>
    <text x="870" y="275" font-size="12" fill="#166534">校验输入 + 查重</text>

    <rect x="680" y="330" width="380" height="46" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="870" y="348" font-size="14" font-weight="bold" fill="#14532d">SQLite (database.db)</text>
    <text x="870" y="365" font-size="12" fill="#166534">用户数据表</text>

    <rect x="680" y="430" width="380" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="870" y="448" font-size="14" font-weight="bold" fill="#713f12">test_api.py</text>
    <text x="870" y="465" font-size="12" fill="#854d0e">独立测试脚本 (requests 库)</text>
  </g>

  <!-- 后端 arrows -->
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="770" y1="196" x2="770" y2="236"/>
    <path d="M 1060 173 L 1096 173 L 1096 353 L 1064 353"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrGray)">
    <path d="M 680 453 L 655 453 L 655 190 L 676 190"/>
  </g>

  <!-- 网络红色箭头: request.js ↔ app.py -->
  <path d="M 285 528 C 470 470, 540 320, 673 190" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 5" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="480" y="300" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">HTTP 网络请求</text>
  <text x="480" y="320" font-size="12" text-anchor="middle" fill="#b91c1c">(http://127.0.0.1:5000)</text>

  <!-- 图例 -->
  <text x="600" y="620" font-size="13" text-anchor="middle" fill="#475569">图例：灰线 = import/调用依赖 │ 红色虚线 = 唯一跨网络的传输 │ 黄色虚线 = 独立测试脚本</text>
</svg>
