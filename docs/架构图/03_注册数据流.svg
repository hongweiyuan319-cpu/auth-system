<svg xmlns="http://www.w3.org/2000/svg" width="660" height="620" viewBox="0 0 660 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="660" height="620" fill="#ffffff"/>
  <text x="330" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">注册功能 · 数据流</text>

  <g text-anchor="middle">
    <rect x="90" y="70" width="480" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="330" y="89" font-size="14" font-weight="bold" fill="#1e293b">用户</text>
    <text x="330" y="105" font-size="12" fill="#475569">填账号密码，点注册</text>

    <rect x="90" y="140" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="159" font-size="14" font-weight="bold" fill="#0c4a6e">pages/Register.jsx</text>
    <text x="330" y="175" font-size="12" fill="#075985">调用 register(username, password)</text>

    <rect x="90" y="210" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="229" font-size="14" font-weight="bold" fill="#0c4a6e">api/auth.js</text>
    <text x="330" y="245" font-size="12" fill="#075985">request.post('/api/register', { username, password })</text>

    <rect x="90" y="280" width="480" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="330" y="299" font-size="14" font-weight="bold" fill="#991b1b">① HTTP POST → 127.0.0.1:5000/api/register</text>
    <text x="330" y="315" font-size="12" fill="#b91c1c">（跨网络）</text>

    <rect x="90" y="350" width="480" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="330" y="369" font-size="14" font-weight="bold" fill="#14532d">后端 app.py</text>
    <text x="330" y="385" font-size="12" fill="#166534">① validate_data 校验 → ② 查重 → ③ 密码哈希 → 写入 SQLite</text>

    <rect x="90" y="420" width="480" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="330" y="439" font-size="14" font-weight="bold" fill="#991b1b">② HTTP 响应 ← { message: "注册成功", code: 200 }</text>
    <text x="330" y="455" font-size="12" fill="#b91c1c">（跨网络）</text>

    <rect x="90" y="490" width="480" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="509" font-size="14" font-weight="bold" fill="#0c4a6e">pages/Register.jsx</text>
    <text x="330" y="525" font-size="12" fill="#075985">alert('注册成功！请登录') → navigate('/login') 跳登录页</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="330" y1="114" x2="330" y2="136"/>
    <line x1="330" y1="184" x2="330" y2="206"/>
    <line x1="330" y1="254" x2="330" y2="276"/>
    <line x1="330" y1="324" x2="330" y2="346" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <line x1="330" y1="394" x2="330" y2="416"/>
    <line x1="330" y1="464" x2="330" y2="486" stroke="#dc2626" marker-end="url(#arrRed)"/>
  </g>

  <text x="330" y="580" font-size="13" text-anchor="middle" fill="#475569">注：注册成功不返回 token，需要再走一次登录才能拿到</text>
</svg>
